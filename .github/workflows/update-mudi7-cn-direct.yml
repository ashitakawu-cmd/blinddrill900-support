name: Update Mudi7 CN Direct list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-mudi7-cn-direct.yml'
      - 'mudi7-cn-direct/scripts/update_cn_direct.py'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build GL.iNet domain lists
        run: python mudi7-cn-direct/scripts/update_cn_direct.py
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mudi7-cn-direct/cn-direct.txt mudi7-cn-direct/cn-direct-full.txt mudi7-cn-direct/cn-direct-glinet.txt
          git diff --cached --quiet || git commit -m 'Update Mudi7 CN direct list'
          git push
